# Native runtime tests on hosted runners, one per platform (PF, <OS>-<ARCH>):
# macos-arm64, macos-amd64, linux-arm64, linux-amd64, mswin-amd64 and
# mswin-arm64. The project's main CI (Mechatron Prime CI, a Nix builder on
# x86_64 Linux) runs tests only inside the Nix build sandbox and can only
# cross-compile for the others; these run on each platform's own filesystem.
name: native

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.os }} (full ./test)
    strategy:
      fail-fast: false
      matrix:
        # macos-arm64, macos-amd64, linux-arm64, linux-amd64
        os: [macos-14, macos-15-intel, ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Full suite in the dev shell
        run: nix develop -c ./test

  windows-x64:
    name: windows-latest (Zig and Rust tests)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Zig unit and integration tests
        run: zig build test --summary all
      - name: Build library and CLI
        run: zig build
      - name: C CLI line endings and switch spelling (native, OS=Windows_NT)
        shell: bash
        run: bash tests/cli/conventions_smoke.sh zig-out/bin/xattr-stream.exe
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust implementation, unit and integration tests
        working-directory: rust
        run: cargo test --release
      - name: Rust CLI line endings and switch spelling (native, OS=Windows_NT)
        shell: bash
        run: |
          cargo build --release --manifest-path rust/Cargo.toml
          bash tests/cli/conventions_smoke.sh rust/target/release/xattr-stream-rs.exe
      # Zig 0.16.0's own aarch64-windows compiler crashes with an access
      # violation (0xC0000005) before compiling anything, so the ARM job runs
      # test executables cross-compiled here instead of compiling natively.
      - name: Cross-compile the test executables for aarch64-windows
        shell: bash
        run: |
          mkdir -p arm64-tests
          for root in xattr_stream ffi names dump; do
            zig test -target aarch64-windows-gnu -OReleaseSafe "src/$root.zig" --test-no-exec -femit-bin="arm64-tests/${root}_tests.exe"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-windows-tests
          path: arm64-tests/*.exe

  windows-arm:
    name: windows-11-arm (Rust tests; Zig tests cross-compiled)
    needs: windows-x64
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust implementation, unit and integration tests (native)
        working-directory: rust
        run: cargo test --release
      - name: Rust CLI line endings and switch spelling (native, OS=Windows_NT)
        shell: bash
        run: |
          cargo build --release --manifest-path rust/Cargo.toml
          bash tests/cli/conventions_smoke.sh rust/target/release/xattr-stream-rs.exe
      - uses: actions/download-artifact@v4
        with:
          name: arm64-windows-tests
      - name: Run the test executables natively
        shell: bash
        run: |
          status=0
          for exe in xattr_stream_tests ffi_tests names_tests dump_tests; do
            echo "== $exe"
            "./$exe.exe" || status=1
          done
          exit $status
