# Native runtime tests on hosted runners for the platforms the project's
# main CI (Mechatron Prime CI, a Nix builder on x86_64 Linux) can only
# cross-compile for. Attribute I/O needs a real filesystem, which Nix's
# build sandbox does not provide, so these run outside any sandbox.
name: native

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.os }} (full ./test)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Full suite in the dev shell
        run: nix develop -c ./test

  windows-x64:
    name: windows-latest (Zig tests)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Zig unit and integration tests
        run: zig build test --summary all
      - name: Build library and CLI
        run: zig build
      # Zig 0.16.0's own aarch64-windows compiler crashes with an access
      # violation (0xC0000005) before compiling anything, so the ARM job runs
      # test executables cross-compiled here instead of compiling natively.
      - name: Cross-compile the test executables for aarch64-windows
        shell: bash
        run: |
          mkdir -p arm64-tests
          for root in xattr_stream ffi names dump; do
            zig test -target aarch64-windows-gnu -OReleaseSafe "src/$root.zig" --test-no-exec -femit-bin="arm64-tests/${root}_tests.exe"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-windows-tests
          path: arm64-tests/*.exe

  windows-arm:
    name: windows-11-arm (Zig tests, cross-compiled)
    needs: windows-x64
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arm64-windows-tests
      - name: Run the test executables natively
        shell: bash
        run: |
          status=0
          for exe in xattr_stream_tests ffi_tests names_tests dump_tests; do
            echo "== $exe"
            "./$exe.exe" || status=1
          done
          exit $status
