# Temporary diagnostics: measure the largest single user-attribute value the
# runner's ext4 accepts, and capture what zig build prints on Windows ARM.
name: probe

on:
  push:
    paths: [".github/workflows/probe.yml"]

permissions:
  contents: read

jobs:
  ext4-max:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: sudo apt-get install -y -qq attr >/dev/null
      - run: |
          set -u
          command -v setfattr
          df -T "$RUNNER_TEMP"; sudo tune2fs -l "$(df --output=source "$RUNNER_TEMP" | tail -1)" 2>/dev/null | grep -Ei 'features|inode size|block size' || true
          for name in k kk kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk; do
            f="$RUNNER_TEMP/probe-$name"; : >"$f"
            lo=0; hi=65536; last_err=""
            while [ $((hi - lo)) -gt 1 ]; do
              mid=$(((lo + hi) / 2))
              if setfattr -n "user.$name" -v "$(head -c "$mid" /dev/zero | tr '\0' 'a')" "$f" 2>"$RUNNER_TEMP/err"; then lo=$mid; else hi=$mid; last_err="$(cat "$RUNNER_TEMP/err")"; fi
              setfattr -x "user.$name" "$f" 2>/dev/null || true
            done
            echo "name user.$name (${#name} chars): largest accepted value $lo bytes; first refusal: ${last_err:-none}"
          done
